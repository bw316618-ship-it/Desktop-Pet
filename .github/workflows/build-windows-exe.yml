name: Build Windows exe

# Builds a double-click BilloRani.exe on a real Windows runner (PyInstaller
# has to run on the target OS — it can't be cross-compiled from Linux/Mac).
#
# Runs on every push to master, and on tags starting with "v" it also
# attaches the exe to a GitHub Release.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build BilloRani.exe
        run: |
          pyinstaller --onefile --windowed --name BilloRani `
            --add-data "assets;assets" `
            br.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BilloRani-windows-exe
          path: dist/BilloRani.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BilloRani.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
